services:
  testedcloud-api:
    build: ./backend
    container_name: testedcloud-api
    environment:
      - GCP_PROJECT_ID=majestic-layout-255620
      - PUBSUB_TOPIC_ID=testedcloud-events
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      - TESTEDCLOUD_API_KEY=replace-me
    volumes:
      - /path/to/your/.config/gcloud:/root/.config/gcloud:ro
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: testedcloud-nginx
    ports:
      - "8082:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - testedcloud-api
    restart: unless-stopped
  testedcloud-ui:
    image: nginx:alpine
    container_name: testedcloud-ui
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    restart: unless-stopped 

