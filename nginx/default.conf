server {
    listen 80;

    location /api/send-event {
        proxy_pass http://testedcloud-api:8080/send-event;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cf-Access-Authenticated-User-Email $http_cf_access_authenticated_user_email;
    }

    location /api/trace-event/ {
        rewrite ^/api/trace-event/(.*)$ /trace-event/$1 break;
        proxy_pass http://testedcloud-api:8080;
        proxy_set_header Host $host;
        proxy_set_header Cf-Access-Authenticated-User-Email $http_cf_access_authenticated_user_email;
    }

    location /api/health {
        proxy_pass http://testedcloud-api:8080/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://testedcloud-ui:80;
        proxy_set_header Host $host;
    }
}
